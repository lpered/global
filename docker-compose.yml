services:
  dbt-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      DBT_RUN_TIME: ${DBT_RUN_TIME:-07:00}
      DBT_RUN_ON_START: ${DBT_RUN_ON_START:-true}
      DBT_TARGET: ${DBT_TARGET:-prod}
      DBT_FULL_REFRESH: ${DBT_FULL_REFRESH:-false}
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE}
      SNOWFLAKE_PROD_SCHEMA: ${SNOWFLAKE_PROD_SCHEMA:-ANALYTICS_PROD}
    volumes:
      - dbt_docs:/published-docs
    healthcheck:
      test: ["CMD-SHELL", "test -f /published-docs/index.html"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5m

  dbt-docs:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    restart: unless-stopped
    depends_on:
      - dbt-scheduler
    ports:
      - "${DBT_DOCS_PORT:-33005}:33006"
    volumes:
      - dbt_docs:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:33006/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  dbt_docs:
