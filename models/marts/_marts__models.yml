version: 2

models:
  - name: dim_users
    description: >
      User dimension at one row per user_id. The natural user_id is the primary
      key. Missing country values are presented as NOT MAPPED. Invalid signup
      dates remain null. Materialized as a table.
    tests:
      # Prevent an empty dimension from passing unique and not-null tests
      # vacuously.
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: user_id
        description: Primary key and natural user identifier.
        tests:
          - not_null
          - unique
      - name: signup_date
        description: User signup date where parseable.
      - name: country
        description: >
          Trimmed source country, defaulted to NOT MAPPED when missing.
        tests:
          - not_null

  - name: dim_episodes
    description: >
      Episode dimension at one row per episode_id. The natural episode_id is
      the primary key. Invalid durations are preserved and flagged so they are
      observable but excluded from rate calculations. Materialized as a table.
    tests:
      # Prevent an empty dimension from passing unique and not-null tests
      # vacuously.
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: episode_id
        description: Primary key and natural episode identifier.
        tests:
          - not_null
          - unique
      - name: podcast_id
        description: Podcast containing the episode.
      - name: episode_title
        description: Episode title.
      - name: release_date
        description: Episode release date where parseable.
      - name: episode_duration_seconds
        description: Episode runtime, distinct from event-reported duration.
      - name: is_valid_duration
        description: True when the duration can safely be used as a denominator.

  - name: fct_interaction_events
    description: >
      Interaction fact at one row per valid, exact-deduplicated source event.
      event_key is generated by generate_event_key using the dbt_utils
      surrogate-key implementation over the cleaned event fields.
      Unsupported, malformed, orphaned, and otherwise invalid records are
      excluded and surfaced in int_rejected_events. Repeated non-identical
      completion events remain separate facts. Materialized as a table.
    tests:
      # The source has no event ID, so these five cleaned fields define an
      # exact event. No duplicate combination should survive into the fact.
      - dbt_expectations.expect_compound_columns_to_be_unique:
          arguments:
            column_list:
              - event_type
              - user_id
              - episode_id
              - timestamp
              - duration
    columns:
      - name: event_key
        description: Primary key for a normalised exact event.
        tests:
          - not_null
          - unique
      - name: event_type
        description: Supported interaction type.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['play', 'pause', 'seek', 'complete']
      - name: user_id
        description: Foreign key to dim_users.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_users')
                field: user_id
      - name: episode_id
        description: Foreign key to dim_episodes.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_episodes')
                field: episode_id
      - name: timestamp
        description: Valid interaction timestamp as timestamp_ntz.
        tests:
          - not_null
          # Allow the lower boundary itself: 2000-01-01 is valid.
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: "'2000-01-01'::timestamp_ntz"
          # Reject timestamps at or beyond 24 hours in the future. `strictly`
          # applies a less-than comparison to this upper boundary.
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                max_value: "dateadd(day, 1, current_timestamp())"
                strictly: true
      - name: event_date
        description: Calendar date derived from timestamp.
        tests:
          - not_null
      - name: duration
        description: >
          Event-reported duration. This is not the episode's total runtime and
          can be null for event types that do not report duration.
        tests:
          # Null duration is allowed, but any supplied value must be >= 0.
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0

  - name: flat_interaction_events
    description: >
      Denormalized interaction model at one row per valid event_key. It combines
      the interaction fact with user and episode attributes so all required
      take-home analyses can query one relation. Materialized as a reporting
      view.
    columns:
      - name: event_key
        description: Primary key inherited from fct_interaction_events.
        tests:
          - not_null
          - unique
      - name: event_type
        description: Supported interaction type.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['play', 'pause', 'seek', 'complete']
      - name: user_id
        description: User associated with the event.
        tests:
          - not_null
      - name: episode_id
        description: Episode associated with the event.
        tests:
          - not_null
      - name: timestamp
        description: Valid event timestamp.
        tests:
          - not_null
      - name: event_date
        description: Calendar event date.
        tests:
          - not_null
      - name: duration
        description: Event-reported duration.
      - name: signup_date
        description: Signup date from dim_users.
      - name: country
        description: Country from dim_users.
        tests:
          - not_null
      - name: podcast_id
        description: Podcast identifier from dim_episodes.
      - name: episode_title
        description: Episode title from dim_episodes.
      - name: release_date
        description: Episode release date from dim_episodes.
      - name: episode_duration_seconds
        description: Total episode runtime from dim_episodes.
      - name: is_valid_duration
        description: Whether episode duration is safe for rate calculations.
        tests:
          # Only completion events with a supplied event duration contribute
          # to listen-through calculations; those rows require a valid,
          # positive episode-duration denominator.
          - dbt_expectations.expect_column_values_to_be_in_set:
              arguments:
                value_set: [true]
                quote_values: false
                row_condition: >
                  event_type = 'complete'
                  and duration is not null
