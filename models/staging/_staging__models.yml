version: 2

models:
  - name: stg_users
    description: >
      Cleaned user records at one row per source user. IDs are trimmed,
      signup dates are safely parsed, and blank countries remain null.
    columns:
      - name: user_id
        description: Natural user identifier.
      - name: signup_date
        description: Safely parsed user signup date.
      - name: country
        description: Trimmed source country value.

  - name: stg_episodes
    description: >
      Cleaned episode records at one row per source episode. Invalid durations
      are retained and identified rather than discarded. The model uses
      Snowflake incremental merge with episode_id as its unique key. Without a
      source loaded_at watermark, each run evaluates the complete seed.
    columns:
      - name: episode_id
        description: Natural episode identifier.
      - name: podcast_id
        description: Natural podcast identifier.
      - name: episode_title
        description: Episode title from the source.
      - name: release_date
        description: Safely parsed episode release date.
      - name: episode_duration_seconds
        description: Safely parsed episode duration in seconds.
      - name: is_valid_duration
        description: True when episode duration is present and positive.

  - name: stg_event_logs
    description: >
      Normalised event records at one row per exact, deduplicated source event.
      Cleaned business fields retain their original source column names.
      The model uses Snowflake incremental merge with event_key as its unique
      key. Because the seed has no ingestion watermark, every run evaluates the
      complete source before merging. Invalid records are classified downstream.
    columns:
      - name: event_key
        description: >
          Stable key over the five cleaned source event fields, generated by
          generate_event_key using dbt_utils.generate_surrogate_key.
        tests:
          - not_null
          - unique
      - name: event_type
        description: Lowercase and trimmed event type.
      - name: user_id
        description: Trimmed user identifier; source nulls remain null.
      - name: episode_id
        description: Trimmed episode identifier; source nulls remain null.
      - name: timestamp
        description: Original timestamp value exactly as supplied by the source.
      - name: duration
        description: Original duration value exactly as supplied by the source.
      - name: timestamp
        description: Source timestamp safely parsed as Snowflake timestamp_ntz.
      - name: duration
        description: Event duration cast as number(18,3).
